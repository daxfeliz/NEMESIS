[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis-tess"
dynamic = ["version"]
description = "NEMESIS: photometry, detrending and transit search of M dwarfs in TESS full-frame images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dax L. Feliz", email = "dfeliz@flatironinstitute.org" }]

# Python 3.12 is the tested reference interpreter from the NEMESIS II Rusty
# environment snapshot. Other versions can be enabled after CI + science tests.
requires-python = ">=3.12,<3.13"

# Exact direct-package pins from environment/nemesis2_rusty_pip_freeze.txt.
# This is the *actual installed snapshot*, not the later unverified
# requirements.txt (which lists NumPy 2.5 / pandas 3 / SciPy 1.18).
# Relax these for a future cross-platform release after testing.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.15.2",
    "matplotlib==3.10.1",
    "astropy==7.0.1",
    "astroquery==0.4.11",
    "requests==2.32.3",
    "urllib3==2.4.0",
    "beautifulsoup4==4.13.4",
    "transitleastsquares==1.32",
    "wotan==1.9",
    "fbpca==1.0",
    "lightkurve==2.5.0",
    "s3fs==2024.9.0",
    "lksearch==1.2.1",
    "astrobase==0.5.3",
    "pyeebls==0.2.0",
    "tess-point==0.9.3",
    "multiprocess==0.70.16",
    "rasterio==1.3.11",
    "shapely==2.0.6",
    "PyPDF2==3.0.1",
    "Pillow==10.4.0",
    # Preserve the exact LEO-Vetter commit recorded in the Linux freeze.
    "leo_vetter @ git+https://github.com/mkunimoto/LEO-vetter.git@6ca6dc619be90ca855afad5c21eb7ec7425005cf",
]

[project.optional-dependencies]
# JAX/jaxoplanet/NumPyro modeling used in separate NEMESIS II analysis scripts;
# not directly imported by src/nemesis_tess/pipeline.py.
modeling = [
    "jax==0.4.31",
    "jaxlib==0.4.31",
    "jaxoplanet==0.0.4",
    "numpyro==0.18.0",
    "equinox==0.11.10",
    "arviz==0.23.4",
    "corner==2.3.0",
]
# Validated dependency combination for NEMESIS II TRICERATOPS.
# PyTransit 2.2.0 requires legacy NumPy/SciPy aliases supplied by
# nemesis_tess.compat.load_triceratops().
# setuptools 80.10.2 retains pkg_resources, needed by PyTransit.
validation = [
    "triceratops==1.0.20",
    "PyTransit==2.2.0",
    "setuptools==80.10.2",
]
#
# For a single extra covering the *NEMESIS II analysis* environment.
analysis = [
    "jax==0.4.31",
    "jaxlib==0.4.31",
    "jaxoplanet==0.0.4",
    "numpyro==0.18.0",
    "equinox==0.11.10",
    "arviz==0.23.4",
    "corner==2.3.0",
    "triceratops==1.0.20",
    "PyTransit==2.2.0",
    "setuptools==80.10.2",
]
injection = ["batman-package==2.5.3"]
imaging = ["photutils==2.3.0", "reproject==0.14.0"]
prf = ["TESS_PRF==0.1.3"]
# Everything used by the core pipeline and the named optional workflows.
all = [
    "jax==0.4.31", "jaxlib==0.4.31", "jaxoplanet==0.0.4",
    "numpyro==0.18.0", "equinox==0.11.10", "arviz==0.23.4",
    "corner==2.3.0", "triceratops==1.0.20",
    "PyTransit==2.2.0", "setuptools==80.10.2",
    "batman-package==2.5.3", "photutils==2.3.0", "reproject==0.14.0",
    "TESS_PRF==0.1.3",
]
dev = ["build", "pytest", "jupyter", "ipykernel", "jupytext"]

[project.urls]
Homepage = "https://github.com/daxfeliz/NEMESIS"

[tool.setuptools.dynamic]
version = { attr = "nemesis_tess.pipeline.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["nemesis_tess*"]
